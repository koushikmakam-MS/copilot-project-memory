[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aipipeline"
version = "0.1.0"
description = "Deterministic AI pipeline executor with step-level verification"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
aipipeline = "aipipeline.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
