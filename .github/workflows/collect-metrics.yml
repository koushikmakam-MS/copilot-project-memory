name: Collect Adoption Metrics

on:
  schedule:
    # Every Monday at 06:00 UTC — captures the full prior week before data expires
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual runs

permissions:
  contents: write
  pull-requests: write

jobs:
  collect-metrics:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Collect traffic metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/collect-metrics.ps1

      - name: Commit and create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/traffic-history.json docs/ADOPTION.md
          $status = git status --porcelain metrics/ docs/ADOPTION.md
          if ($status) {
            $branch = "automated/update-metrics"
            # Delete remote branch if it exists to avoid checkout conflicts
            $remoteBranch = git ls-remote --heads origin $branch 2>$null
            if ($remoteBranch) {
              git push origin --delete $branch 2>$null
            }
            # Create fresh branch from current master with metrics changes
            git checkout -b $branch
            git commit -m "chore: update adoption metrics $(Get-Date -Format 'yyyy-MM-dd') [skip ci]"
            git push origin $branch
            # Create PR, approve it, and merge with admin bypass
            gh pr create --title "chore: update adoption metrics" --body "Auto-generated weekly metrics update." --base master --head $branch
            gh pr review $branch --approve
            gh pr merge $branch --squash --admin --delete-branch
          } else {
            Write-Host "No changes to commit"
          }
