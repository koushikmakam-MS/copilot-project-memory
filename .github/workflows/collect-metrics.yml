name: Collect Adoption Metrics

on:
  schedule:
    # Every Monday at 06:00 UTC — captures the full prior week before data expires
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual runs

permissions:
  contents: write

jobs:
  collect-metrics:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Collect traffic metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/collect-metrics.ps1

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/traffic-history.json docs/ADOPTION.md
          $status = git status --porcelain metrics/ docs/ADOPTION.md
          if ($status) {
            git commit -m "chore: update adoption metrics [skip ci]"
            git push
          } else {
            Write-Host "No changes to commit"
          }
