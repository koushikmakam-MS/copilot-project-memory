name: Collect Adoption Metrics

on:
  schedule:
    # Every Monday at 06:00 UTC — captures the full prior week before data expires
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual runs

permissions:
  contents: write
  pull-requests: write

jobs:
  collect-metrics:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Collect traffic metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/collect-metrics.ps1

      - name: Commit and create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/traffic-history.json docs/ADOPTION.md
          $status = git status --porcelain metrics/ docs/ADOPTION.md
          if ($status) {
            $branch = "automated/update-metrics"
            # Check if branch already exists on remote
            $remoteBranch = git ls-remote --heads origin $branch 2>$null
            if ($remoteBranch) {
              # Branch exists — stash changes, checkout, apply, and push
              git stash
              git fetch origin $branch
              git checkout $branch
              git reset --hard origin/$branch
              git checkout stash -- metrics/traffic-history.json docs/ADOPTION.md
              git add metrics/traffic-history.json docs/ADOPTION.md
              git commit -m "chore: update adoption metrics $(Get-Date -Format 'yyyy-MM-dd') [skip ci]"
              git push origin $branch
              Write-Host "Updated existing branch and PR"
            } else {
              # No branch — create new branch and PR
              git checkout -b $branch
              git commit -m "chore: update adoption metrics $(Get-Date -Format 'yyyy-MM-dd') [skip ci]"
              git push origin $branch
              gh pr create --title "chore: update adoption metrics" --body "Auto-generated weekly metrics update. Approve and merge when ready." --base master --head $branch
              Write-Host "Created new PR"
            }
          } else {
            Write-Host "No changes to commit"
          }
